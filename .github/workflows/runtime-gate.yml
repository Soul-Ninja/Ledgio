name: Runtime Gate Verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime-gate:
    name: Headless Edge Runtime Gates (121 Checks)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify innerHTML Security Audit Gate
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_innerhtml_audit.ps1

      - name: Verify Version Consistency
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/check_version_consistency.ps1

      - name: Verify Minified Bundles Are Current
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/check_build_current.ps1

      - name: Verify Database Migrations Integrity
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/check_migrations.ps1

      - name: Execute Runtime Regression Gate Test Suite
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/test_runtime_gate.ps1
